name: medicortex
description: "A new Flutter Chat application using MCP and Gemini"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  mcp_dart: ^0.3.6
  google_generative_ai: ^0.4.7
  flutter_riverpod: ^2.0.1
  http: ^1.3.0
  flutter_markdown:
    git:
      url: https://github.com/mj-963/flutter_markdown_latex_stream.git
      ref: main
  shared_preferences: ^2.5.3
  collection: ^1.19.1
  uuid: ^4.5.1
  flutter_inappwebview: ^6.1.5
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  path_provider: ^2.1.5
  googleapis_auth: ^2.0.0
  pdf: ^3.11.3
  printing: ^5.14.2

dependency_overrides:
  # Removed analyzer override for Drift compatibility

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
